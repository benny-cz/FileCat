<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.filecat.Permissions"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.filecat.Permissions" send_path="/org/filecat/Permissions"
           send_interface="org.filecat.Permissions1" send_member="Begin"/>
    <allow send_destination="org.filecat.Permissions" send_path="/org/filecat/Permissions"
           send_interface="org.filecat.Permissions1" send_member="Inspect"/>
    <allow send_destination="org.filecat.Permissions" send_path="/org/filecat/Permissions"
           send_interface="org.filecat.Permissions1" send_member="Apply"/>
    <allow send_destination="org.filecat.Permissions" send_path="/org/filecat/Permissions"
           send_interface="org.filecat.Permissions1" send_member="Cancel"/>
  </policy>
</busconfig>
