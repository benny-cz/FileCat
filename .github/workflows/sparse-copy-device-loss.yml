name: Windows sparse copy device-loss qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build with locked dependencies
        shell: pwsh
        run: dotnet build tests/FileCat.Core.Tests/FileCat.Core.Tests.csproj -c Release -p:RestoreLockedMode=true
      - name: Detach an owned NTFS VHDX during sparse copy
        shell: pwsh
        run: |
          ./eng/validation/Invoke-SparseCopyDeviceLoss.ps1 `
            -ScratchRoot (Join-Path $env:RUNNER_TEMP ("sparse-device-loss-$env:GITHUB_RUN_ID")) `
            -TestAssembly (Join-Path $PWD 'tests/FileCat.Core.Tests/bin/Release/net10.0/FileCat.Core.Tests.dll') `
            -MediumIntegrityHelper (Join-Path $PWD 'eng/validation/Enter-MediumIntegrityTestProcess.ps1')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sparse-copy-device-loss-arm64
          path: ${{ runner.temp }}/sparse-device-loss-${{ github.run_id }}/*
          if-no-files-found: warn
