name: Release records

# Pushes to main that touch the release ledgers or evidence. CI skips the pushes that touch nothing else
# (paths-ignore there), so this keeps the ledgers' own check on every such push.
on:
  push:
    branches: [main]
    paths: ["docs/release/**"]

permissions:
  contents: read

jobs:
  validate:
    name: Release tracking tables
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release tracking tables
        run: python3 eng/validation/validate-release-issue-register.py
