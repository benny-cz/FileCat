name: Windows ARM64 NTFS qualification

on:
  workflow_dispatch:
    inputs:
      keys:
        description: Run the native EFS key comparison, recovery and backup wizard checks
        type: boolean
        default: false
      recovery:
        description: Qualify EFS first use, independent restore, and default-key changes under fresh local accounts
        type: boolean
        default: false
      archives:
        description: Qualify EFS protections for archive packing, editing and publication
        type: boolean
        default: false
      broker:
        description: Qualify the native administrator copy broker with EFS fixtures
        type: boolean
        default: false
      remote:
        description: Qualify EFS upload and source retirement with a controlled remote fixture
        type: boolean
        default: false
      reports:
        description: Qualify native NTFS details and supplementary-value report publication
        type: boolean
        default: false
      commands:
        description: Qualify native NTFS storage commands, EFS consent and selection refresh
        type: boolean
        default: false
      sparse:
        description: Qualify sparse main and named streams through native storage transforms
        type: boolean
        default: false
      scale:
        description: Run the 10,000-file native storage benchmark
        type: boolean
        default: false
      evidence:
        description: Measure native journal startup, quota refusal, review and retention
        type: boolean
        default: false
      operations:
        description: Drive the native Operations window with the 10,000-file workload
        type: boolean
        default: false
      listing:
        description: Compare native and managed listing at 10,000 and 1,000,000 entries
        type: boolean
        default: false
      listing_remount:
        description: Compare each listing path after a separate read-only NTFS image mount
        type: boolean
        default: false
      listing_smb:
        description: Compare native and managed listing on a mapped and UNC SMB share
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-storage-abi:
    name: Native storage jobs and EFS output protection
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build with locked dependencies
        shell: pwsh
        run: |
          foreach ($project in @('tests/FileCat.Platform.Windows.Tests', 'tests/FileCat.Core.Tests')) {
            dotnet restore $project --locked-mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build $project -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Exercise native storage at medium integrity
        env:
          FILECAT_QUALIFY_ARCHIVES: ${{ inputs.archives }}
          FILECAT_QUALIFY_EVIDENCE: ${{ inputs.evidence }}
          FILECAT_QUALIFY_KEYS: ${{ inputs.keys }}
          FILECAT_QUALIFY_SCALE: ${{ inputs.scale }}
          FILECAT_QUALIFY_SPARSE: ${{ inputs.sparse }}
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'filecat-native-storage-abi-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $fixture = Join-Path $env:RUNNER_TEMP 'filecat-native-storage-abi-fixture'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $owner = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $system = [Security.Principal.SecurityIdentifier]::new('S-1-5-18')
          $access = [Security.AccessControl.DirectorySecurity]::new()
          $access.SetOwner($owner)
          $access.SetAccessRuleProtection($true, $false)
          foreach ($principal in $owner, $system) {
            $access.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new(
              $principal, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow'))
          }
          Set-Acl -LiteralPath $fixture -AclObject $access
          $volume = Get-Volume -DriveLetter ([IO.Path]::GetPathRoot($fixture)[0])
          $os = Get-CimInstance Win32_OperatingSystem
          if ($volume.FileSystem -ne 'NTFS' -or $volume.AllocationUnitSize -ne 4096 -or $os.ProductType -ne 1) {
            throw 'Requires a Windows client with a prepared 4 KiB local NTFS volume.'
          }
          $drive = "$($volume.DriveLetter):"
          $instances = & fltmc.exe instances -v $drive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $instances | Set-Content -LiteralPath (Join-Path $evidence 'filters-before.txt')
          if (-not ($instances -match '^\s*CldFlt\s')) {
            $loaded = & fltmc.exe filters
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($loaded -match '^\s*CldFlt\s')) {
              & fltmc.exe load CldFlt
              if ($LASTEXITCODE -ne 0) { Write-Warning 'The runner could not load the Cloud Files filter.' }
            }
            $instances = & fltmc.exe instances -v $drive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($instances -match '^\s*CldFlt\s')) {
              & fltmc.exe attach CldFlt $drive
              if ($LASTEXITCODE -ne 0) { Write-Warning 'The runner could not attach the Cloud Files filter to the fixture volume.' }
            }
          }
          $instances = & fltmc.exe instances -v $drive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $instances | Set-Content -LiteralPath (Join-Path $evidence 'filters-after.txt')
          if (-not ($instances -match '^\s*CldFlt\s')) { Write-Warning 'The Cloud Files filter is missing from the fixture volume.' }
          [ordered]@{
            commit = $env:GITHUB_SHA
            operatingSystem = $os.Caption
            build = $os.BuildNumber
            filesystem = $volume.FileSystem
            allocationUnit = $volume.AllocationUnitSize
            testAssembly = (Get-FileHash tests/FileCat.Platform.Windows.Tests/bin/Release/net10.0/FileCat.Platform.Windows.Tests.dll).Hash
            coreTestAssembly = (Get-FileHash tests/FileCat.Core.Tests/bin/Release/net10.0/FileCat.Core.Tests.dll).Hash
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'native-storage-abi.json')
          dotnet --info | Out-File -LiteralPath (Join-Path $evidence 'dotnet.txt')
          # The second fixture can enroll a software EFS key in this disposable runner's profile.
          $env:FILECAT_TEST_WINDOWS_STORAGE_ABI_ROOT = $fixture
          $env:FILECAT_TEST_WINDOWS_STORAGE_ABI_ARCHITECTURE = 'Arm64'
          $env:FILECAT_TEST_WINDOWS_STORAGE_ARM64_JOBS = '1'
          $env:FILECAT_TEST_EFS = '1'
          $env:TMP = $fixture
          $env:TEMP = $fixture
          $filter = @(
            'WindowsStorageAbiTests'
            'Recursive_job_covers_reverse_order_overlaps_hidden_files_and_named_streams_without_double_counts'
            'Preorder_directory_mutation_and_recursion_reuse_the_mutation_handles_with_live_review_pins'
            'Noop_ReadOnly_file_needs_no_write_handle_even_with_an_existing_writer'
            'Renamed_review_path_replaced_by_another_object_never_chases_the_original_or_changes_the_replacement'
            'Conflicting_writer_refuses_before_call_then_fresh_preparation_can_change_the_same_held_object'
            'A_new_hard_link_after_compression_preparation_is_blocked_or_refused_before_the_native_call'
            'Case_sensitive_siblings_keep_distinct_IDs_and_drive_extended_and_volume_paths_keep_one_physical_pin'
            'Replacing_a_child_after_the_native_cursor_reads_its_id_preserves_both_files'
            'Readonly_file_and_reparse_subtree_are_skipped_while_independent_siblings_are_changed'
            'Native_access_denial_preserves_independent_siblings'
            'Selected_Efs_jobs_share_one_lazy_key_choice_and_record_native_effects_on_disk'
            'Recursive_Efs_uses_held_ancestry_for_overlaps_and_starts_setup_below_an_encrypted_root'
            'Canceling_lazy_recovery_stops_before_any_native_intent'
            'Ineligible_items_do_not_request_recovery_or_record_a_native_intent'
            'Unreadable_sparse_stream_after_encryption_retains_observed_key_and_stops_the_job'
            'Unqualified_hosts_refuse_storage_before_opening_any_path_and_do_not_offer_private_history'
          ) | ForEach-Object { "FullyQualifiedName~$_" }
          $filter = $filter -join '|'
          ./eng/validation/run-medium-integrity-test.ps1 -Project tests/FileCat.Platform.Windows.Tests -LogFileName native-storage-abi.trx -Filter $filter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $results = 'tests/FileCat.Platform.Windows.Tests/TestResults/native-storage-abi.trx'
          [xml]$receipt = Get-Content -LiteralPath $results -Raw
          $counters = $receipt.TestRun.ResultSummary.Counters
          if ($counters.total -ne '20' -or $counters.executed -ne '20' -or $counters.passed -ne '20') {
            throw 'All twenty native fixture cases must execute and pass.'
          }

          $env:FILECAT_TEST_WINDOWS_STORAGE_ARM64_OUTPUTS = '1'
          $env:FILECAT_TEST_CLOUD_FILES = '1'
          $env:FILECAT_TEST_STORAGE_UI = '1'
          $env:FILECAT_ENUM_NATIVE_LINKS = '1'
          $detailsFilter = @(
            'Summary_and_metadata_full_inspect_one_object_without_legacy_payload_sections'
            'Summary_preserves_the_native_missing_target_status'
            'A_cloud_placeholder_reads_its_state_without_being_downloaded'
            'A_cloud_sync_root_and_its_placeholder_folders_are_folders_not_links'
            'Full_NTFS_report_reads_actual_names_and_observed_volume_relative_paths'
            'Full_record_maps_a_native_NTFS_file_and_leaves_summary_and_directories_without_the_section'
            'Native_listing_preserves_names_attributes_batches_and_metadata_without_child_opens'
            'Native_listing_matches_long_paths_and_distinguishes_junction_and_symlink_tags'
            'An_empty_directory_has_no_entries_and_a_missing_directory_fails_before_publication'
            'Protected_values_are_viewable_and_refused_by_derived_output'
            'Opened_stream_output_refuses_a_later_efs_change_before_reading_more_bytes'
            'Reviewed_supplementary_actions_refuse_a_replacement_file'
            'Bounded_inventory_and_actions_keep_ADS_EA_categories_folder_streams_and_required_roles'
          ) | ForEach-Object { "FullyQualifiedName~$_" }
          $outputSuites = @(
            @{ Project = 'tests/FileCat.Platform.Windows.Tests'; Log = 'native-efs-binding.trx'; Count = '21';
               Filter = 'FullyQualifiedName~WindowsEfsPathTests' },
            @{ Project = 'tests/FileCat.Platform.Windows.Tests'; Log = 'native-efs-hex-output.trx'; Count = '14';
               Filter = 'FullyQualifiedName~HexEfsJournalTests|FullyQualifiedName~HexPatchProvenanceTests' },
            @{ Project = 'tests/FileCat.Platform.Windows.Tests'; Log = 'native-efs-copy-output.trx'; Count = '7';
               Filter = 'FullyQualifiedName~Native_copy_and_same_volume_move_preserve_efs_and_named_streams_on_ntfs|FullyQualifiedName~Copy_then_delete_keeps_the_efs_source|FullyQualifiedName~WindowsEfsReplacementTests' },
            @{ Project = 'tests/FileCat.Platform.Windows.Tests'; Log = 'native-file-details.trx'; Count = '18';
               Filter = $detailsFilter -join '|' },
            @{ Project = 'tests/FileCat.Core.Tests'; Log = 'native-efs-archive-output.trx'; Count = '10';
               Filter = 'FullyQualifiedName~ArchiveEfsSpoolTests' },
            @{ Project = 'tests/FileCat.Core.Tests'; Log = 'native-efs-recovery-output.trx'; Count = '3';
               Filter = 'FullyQualifiedName~Disk_image_efs_protection_controls_recovery_drag_and_spool|FullyQualifiedName~A_recovery_output_reader_stops_when_its_open_disk_image_becomes_encrypted' }
          )
          if ($env:FILECAT_QUALIFY_SPARSE -eq 'true') {
            $env:FILECAT_TEST_SPARSE_TRANSFORMS = '1'
            $sparseFilter = @(
              'Efs_native_actions_preserve_identity_and_logical_bytes_in_bounded_sparse_fixtures'
              'Compression_native_actions_preserve_identity_and_logical_bytes_in_bounded_sparse_fixtures'
              'Reviewed_compression_jobs_preserve_sparse_streams_and_do_not_call_native_for_noops'
              'Reviewed_efs_binding_preserves_sparse_main_and_named_layouts'
              'Named_sparse_layout_growth_before_or_during_the_call_is_never_reported_as_success'
              'A_sparse_range_overflow_refuses_before_a_native_call_while_a_noop_requires_no_inventory'
              'Reviewed_hex_save_as_keeps_sparse_ranges_in_an_approved_clear_copy'
            ) | ForEach-Object { "FullyQualifiedName~WindowsSparseTransformTests.$_" }
            $outputSuites += @{ Project = 'tests/FileCat.Platform.Windows.Tests'; Log = 'native-storage-sparse.trx';
                Count = '23'; Filter = $sparseFilter -join '|' }
          }
          if ($env:FILECAT_QUALIFY_EVIDENCE -eq 'true') {
            $env:FILECAT_TEST_STORAGE_SCALE = '1'
            $evidenceFilter = @(
              'Private_history_stays_readable_when_pending_reviews_fill_the_process_allowance'
              'Held_history_cursor_streams_multiple_batches_and_binds_every_entry_to_native_identity'
              'Live_private_writer_keeps_its_prior_durable_prefix_readable_during_a_blocked_later_flush'
              'Near_full_private_journals_preserve_review_and_release_space_only_after_acknowledgment'
              'Bound_export_publishes_exact_bytes_for_live_prefix_and_inactive_raw_review'
            ) | ForEach-Object { "FullyQualifiedName~$_" }
            $outputSuites += @{ Project = 'tests/FileCat.Platform.Windows.Tests'; Log = 'native-storage-evidence-limits.trx';
                Count = '6'; Filter = $evidenceFilter -join '|' }
          }
          if ($env:FILECAT_QUALIFY_ARCHIVES -eq 'true') {
            $archiveFilter = @(
              'Pack_refuses_EFS_before_loading_an_input_or_creating_a_stage'
              'Legacy_pack_and_move_stop_when_the_actual_source_is_encrypted_after_initial_capture'
              'Legacy_packing_holds_clear_inputs_through_worker_reads'
              'A_retained_packing_view_holds_the_source_clear_until_release'
              'The_legacy_zip_stays_clear_from_the_held_baseline_through_member_extraction'
              'The_native_archive_review_lease_holds_the_exact_outer_file_clear_until_release'
              'Encrypting_the_outer_zip_refuses_the_legacy_edit_before_working_output'
              'A_legacy_commit_review_discloses_encryption_and_keeps_the_working_copy'
              'An_existing_working_file_encrypted_outside_FileCat_is_refused_before_capture'
              'An_open_working_file_cannot_be_encrypted_during_capture'
              'Save_copy_capture_refuses_an_efs_inherited_temporary_file_before_payload'
              'Recovered_save_copy_keeps_efs_payloads_out_of_unreviewed_publication'
              'The_legacy_commit_copy_stays_clear_during_path_based_job_reads_and_is_retired'
              'A_legacy_commit_copy_encrypted_before_sealing_is_kept_before_queueing'
              'A_live_snapshot_blocks_encryption_while_jobs_read_it_and_retires_its_own_file'
              'Legacy_revision_does_not_hash_an_archive_encrypted_after_the_reader_opens'
              'Archive_update_refuses_a_target_encrypted_after_review_before_staging'
              'Native_transaction_refuses_an_encrypted_snapshot_before_copying_original_bytes'
              'Native_update_read_view_refuses_protection_drift_on_the_held_original'
              'Legacy_update_preserves_newly_encrypted_original_during_preparation_or_backup_review'
              'Legacy_update_refuses_changed_or_encrypted_stage_after_verification'
              'Legacy_update_keeps_both_files_if_the_replacement_or_unverified_backup_becomes_EFS_protected'
              'Legacy_partial_replace_restores_only_the_exact_encrypted_original_to_a_vacant_name'
              'WindowsLegacyZipEfsSpoolTests'
            ) | ForEach-Object { "FullyQualifiedName~$_" }
            $outputSuites += @{ Project = 'tests/FileCat.Platform.Windows.Tests'; Log = 'native-efs-archive-protection.trx';
                Count = '49'; Filter = $archiveFilter -join '|' }
          }
          if ($env:FILECAT_QUALIFY_KEYS -eq 'true') {
            $keyFilter = @(
              'Fresh_private_key_comparison_supports_Capi_and_Cng_without_exporting_private_material'
              'A_cached_key_B_does_not_make_certificate_A_a_matching_key_even_when_direct_cached_acquisition_succeeds'
              'A_source_caching_preference_is_not_copied_into_the_fresh_context_or_healed_in_the_original'
              'Unqualified_provider_parameters_and_a_different_encoded_certificate_do_not_become_known_key_access'
              'A_public_certificate_or_foreign_invoker_does_not_establish_private_key_access'
              'Exact_current_user_store_lookup_does_not_select_another_certificate_or_enroll_a_key'
              'Backup_review_lists_only_selected_files_and_rechecks_their_exact_identities'
              'Default_recovery_workflow_requires_setup_and_an_explicit_recovery_choice_after_backup_failure'
            ) | ForEach-Object { "FullyQualifiedName~$_" }
            $env:FILECAT_TEST_EFS_BACKUP_WIZARD = '1'
            $env:FILECAT_TEST_EFS_KEY_WINDOW = '1'
            $outputSuites += @(
              @{ Project = 'tests/FileCat.Platform.Windows.Tests'; Log = 'native-efs-keys.trx'; Count = '11';
                 Filter = $keyFilter -join '|' },
              @{ Project = 'tests/FileCat.Platform.Windows.Tests'; Log = 'native-efs-wizard.trx'; Count = '6';
                 Filter = 'FullyQualifiedName~Parented_private_key_backup_distinguishes_cancellation_from_completed_export|FullyQualifiedName~Selected_file_key_backup_reports_only_the_matching_files_after_export|FullyQualifiedName~Isolated_CryptoAPI_wizard_cancels_or_exports_the_compared_private_key' },
              @{ Project = 'tests/FileCat.Platform.Windows.Tests'; Log = 'native-efs-parented-provider.trx'; Count = '4';
                 Filter = 'FullyQualifiedName~Fresh_parented_acquisition_still_requires_the_exact_public_key|FullyQualifiedName~Reviewed_parented_acquisition_requires_explicit_access|FullyQualifiedName~Isolated_CryptoAPI_review_compares_only_the_exact_stored_key' }
            )
          }
          foreach ($suite in $outputSuites) {
            ./eng/validation/run-medium-integrity-test.ps1 -Project $suite.Project -LogFileName $suite.Log -Filter $suite.Filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            [xml]$receipt = Get-Content -LiteralPath "$($suite.Project)/TestResults/$($suite.Log)" -Raw
            $counters = $receipt.TestRun.ResultSummary.Counters
            if ($counters.total -ne $suite.Count -or $counters.executed -ne $suite.Count -or $counters.passed -ne $suite.Count) {
              throw "All $($suite.Count) native cases must execute and pass in $($suite.Log)."
            }
          }
          if ($env:FILECAT_QUALIFY_SCALE -eq 'true') {
            $workerDirectory = Join-Path $env:RUNNER_TEMP 'filecat-native-storage-scale-app'
            dotnet restore src/FileCat.App --locked-mode -p:RuntimeIdentifier=win-arm64 -p:SelfContained=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet publish src/FileCat.App -c Release -r win-arm64 --self-contained false --no-restore -o $workerDirectory
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:FILECAT_STORAGE_CLOUD_WORKER_EXECUTABLE = Join-Path $workerDirectory 'FileCat.exe'
            $env:FILECAT_TEST_STORAGE_SCALE = '1'
            Get-FileHash -LiteralPath $env:FILECAT_STORAGE_CLOUD_WORKER_EXECUTABLE,(Join-Path $workerDirectory 'FileCat.dll'),(Join-Path $workerDirectory 'FileCat.Platform.Windows.dll') |
              Select-Object @{Name='File'; Expression={ Split-Path -Leaf $_.Path }},Hash |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'scale-worker-sha256.json')
            ./eng/validation/run-medium-integrity-test.ps1 -Project tests/FileCat.Platform.Windows.Tests -LogFileName native-storage-scale.trx -Filter 'FullyQualifiedName~Ten_thousand_NTFS_files_keep_durable_progress_and_allow_live_review_while_paused'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            [xml]$receipt = Get-Content -LiteralPath 'tests/FileCat.Platform.Windows.Tests/TestResults/native-storage-scale.trx' -Raw
            $counters = $receipt.TestRun.ResultSummary.Counters
            if ($counters.total -ne '1' -or $counters.executed -ne '1' -or $counters.passed -ne '1') {
              throw 'The native 10,000-file benchmark must execute and pass.'
            }
          }
      - name: Exercise native ARM64 administrator copy with EFS
        if: inputs.broker
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'filecat-native-storage-abi-fixture'
          $env:FILECAT_TEST_WINDOWS_STORAGE_ABI_ROOT = $fixture
          $env:FILECAT_TEST_WINDOWS_STORAGE_ABI_ARCHITECTURE = 'Arm64'
          $env:FILECAT_TEST_WINDOWS_STORAGE_ARM64_JOBS = '1'
          $env:FILECAT_TEST_EFS = '1'
          $env:TMP = $fixture
          $env:TEMP = $fixture
          $project = 'tests/FileCat.Platform.Windows.Tests'
          $efsCases = @(
            'Administrator_copy_refuses_efs_sources_and_retains_encrypted_destinations'
            'The_administrator_copy_holds_the_source_clear_during_native_reads'
            'A_marked_administrator_replacement_commits_or_rolls_back_the_entire_copy'
            'An_encrypted_destination_default_refuses_administrator_copy_before_creation'
          ) | ForEach-Object { "FullyQualifiedName~$_" }
          $efsFilter = $efsCases -join '|'
          $highFilter = "$efsFilter|FullyQualifiedName~High_token_copy_runner_keeps_the_mark_at_a_protected_destination"
          dotnet test $project -c Release --no-build --filter $highFilter --logger 'trx;LogFileName=native-efs-broker-high.trx'
          $highExit = $LASTEXITCODE
          ./eng/validation/run-medium-integrity-test.ps1 -Project $project -LogFileName native-efs-broker-medium.trx -Filter $efsFilter
          if ($LASTEXITCODE -ne 0 -or $highExit -ne 0) { exit 1 }
          foreach ($scope in @(@{ Level = 'high'; Count = '10' }, @{ Level = 'medium'; Count = '9' })) {
            [xml]$receipt = Get-Content -LiteralPath "$project/TestResults/native-efs-broker-$($scope.Level).trx" -Raw
            $counters = $receipt.TestRun.ResultSummary.Counters
            if ($counters.total -ne $scope.Count -or $counters.executed -ne $scope.Count -or $counters.passed -ne $scope.Count) {
              throw "All $($scope.Count) native $($scope.Level)-integrity broker cases must execute and pass."
            }
          }
      - name: Qualify native ARM64 application commands and output routes
        if: inputs.remote || inputs.reports || inputs.commands
        env:
          FILECAT_QUALIFY_COMMANDS: ${{ inputs.commands }}
          FILECAT_QUALIFY_REMOTE: ${{ inputs.remote }}
          FILECAT_QUALIFY_REPORTS: ${{ inputs.reports }}
        shell: pwsh
        run: |
          $project = 'tests/FileCat.App.Tests'
          dotnet restore $project --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = Join-Path $env:RUNNER_TEMP 'filecat-native-storage-abi-fixture'
          $env:FILECAT_TEST_WINDOWS_STORAGE_ABI_ROOT = $fixture
          $env:FILECAT_TEST_WINDOWS_STORAGE_ABI_ARCHITECTURE = 'Arm64'
          $env:FILECAT_TEST_EFS = '1'
          $env:FILECAT_EDIT_NATIVE_ROOT = $fixture
          $env:TMP = $fixture
          $env:TEMP = $fixture
          $appEvidence = Join-Path $env:RUNNER_TEMP 'filecat-native-storage-abi-evidence/app.json'
          [ordered]@{
            commit = $env:GITHUB_SHA
            testAssembly = (Get-FileHash "$project/bin/Release/net10.0/FileCat.App.Tests.dll").Hash
          } | ConvertTo-Json | Set-Content -LiteralPath $appEvidence
          $suites = @()
          if ($env:FILECAT_QUALIFY_COMMANDS -eq 'true') {
            $env:FILECAT_TEST_WINDOWS_STORAGE_ARM64_JOBS = '1'
            $env:FILECAT_TEST_STORAGE_UI = '1'
            $env:FILECAT_TEST_EFS_UI = '1'
            $suites += @{ Log = 'native-storage-commands.trx'; Count = '10'; Filter = 'FullyQualifiedName~StorageCommandNativeTests' }
            $recoveryAdmission = @(
              'Device_admission_rechecks_a_process_inventory_changed_during_confirmation'
              'Whole_disk_scan_refuses_a_reader_without_the_selected_disk_number'
              'Drive_letter_scan_refuses_a_replaced_backing_before_reading_it'
              'Drive_letter_scan_refuses_a_reused_interface_with_a_new_disk_number'
            ) | ForEach-Object { "FullyQualifiedName~RecoverySafetyTests.$_" }
            $suites += @{ Log = 'native-recovery-admission.trx'; Count = '15'; Filter = $recoveryAdmission -join '|' }
          }
          if ($env:FILECAT_QUALIFY_REMOTE -eq 'true') {
            $suites += @{ Log = 'native-efs-remote-upload.trx'; Count = '39';
                Filter = 'FullyQualifiedName~FileCat.App.Tests.EfsRemoteUploadTests|FullyQualifiedName~FileCat.App.Tests.SftpRetainedEditTests' }
          }
          if ($env:FILECAT_QUALIFY_REPORTS -eq 'true') {
            $reports = @(
              'Protected_or_unverified_report_text_cannot_reach_a_picker_or_clipboard'
              'Saving_a_value_report_cancels_a_stale_picker_and_only_creates_new_files'
              'Saving_file_system_details_replaces_a_clear_file_and_preserves_an_Efs_destination'
              'Canonical_details_refuses_unqualified_full_content_before_display_copy_or_save'
            ) | ForEach-Object { "FullyQualifiedName~$_" }
            $suites += @{ Log = 'native-efs-report-output.trx'; Count = '8'; Filter = $reports -join '|' }
          }
          foreach ($suite in $suites) {
            ./eng/validation/run-medium-integrity-test.ps1 -Project $project -LogFileName $suite.Log -Filter $suite.Filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            [xml]$receipt = Get-Content -LiteralPath "$project/TestResults/$($suite.Log)" -Raw
            $counters = $receipt.TestRun.ResultSummary.Counters
            if ($counters.total -ne $suite.Count -or $counters.executed -ne $suite.Count -or $counters.passed -ne $suite.Count) {
              throw "All $($suite.Count) native cases must execute and pass in $($suite.Log)."
            }
          }
      - name: Measure native and managed NTFS listing at scale
        if: inputs.listing
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('filecat-native-listing-' + [guid]::NewGuid().ToString('N'))
          $volume = Get-Volume -DriveLetter ([IO.Path]::GetPathRoot($root)[0])
          if ($volume.FileSystem -ne 'NTFS' -or $volume.AllocationUnitSize -ne 4096 -or $volume.SizeRemaining -lt 2GB) {
            throw 'The listing fixture requires space on local 4 KiB NTFS.'
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Globalization;
          using System.IO;
          public static class FileCatListingFixture
          {
              public static void Seed(string directory, int count)
              {
                  Directory.CreateDirectory(directory);
                  for (int index = 0; index < count; index++)
                  {
                      string name = index.ToString("D7", CultureInfo.InvariantCulture) + ".bin";
                      using var file = File.Open(Path.Combine(directory, name), FileMode.CreateNew, FileAccess.Write, FileShare.None);
                  }
              }
          }
          '@
          foreach ($count in 10000,1000000) {
            $env:FILECAT_ENUM_FIXTURE = Join-Path $root "entries-$count"
            $env:FILECAT_ENUM_EXPECTED_COUNT = "$count"
            $env:FILECAT_ENUM_ROUTE = $null
            [FileCatListingFixture]::Seed($env:FILECAT_ENUM_FIXTURE, $count)
            $log = "native-listing-performance-$count.trx"
            ./eng/validation/run-medium-integrity-test.ps1 -Project tests/FileCat.Platform.Windows.Tests -LogFileName $log -Filter 'FullyQualifiedName~Enumeration_performance_records_native_and_managed_timings_on_a_prepared_directory'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            [xml]$receipt = Get-Content -LiteralPath "tests/FileCat.Platform.Windows.Tests/TestResults/$log" -Raw
            $counters = $receipt.TestRun.ResultSummary.Counters
            if ($counters.total -ne '1' -or $counters.executed -ne '1' -or $counters.passed -ne '1') {
              throw "The $count-entry listing measurement must execute and pass."
            }
          }
      - name: Compare listing paths after separate NTFS mounts
        if: inputs.listing_remount
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('filecat-native-listing-remount-' + [guid]::NewGuid().ToString('N'))
          ./eng/validation/Measure-NtfsListingAfterRemount.ps1 -ScratchRoot $root
      - name: Compare native and managed listing over SMB
        if: inputs.listing_smb
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('filecat-native-listing-smb-' + [guid]::NewGuid().ToString('N'))
          $binary = 'tests/FileCat.Platform.Windows.Tests/bin/Release/net10.0/FileCat.Platform.Windows.Tests.dll'
          ./eng/validation/Test-NativeSmbListing.ps1 -TestBinary $binary -EvidenceDirectory $root -Architecture Arm64
      - name: Restore a fixture EFS key under a second account
        if: inputs.recovery
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('filecat-efs-recovery-' + [guid]::NewGuid().ToString('N'))
          $desktopPowerShell = Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $tests = (Resolve-Path 'tests/FileCat.Platform.Windows.Tests/bin/Release/net10.0').Path
          & $desktopPowerShell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./eng/validation/Test-NativeEfsRecovery.ps1 -Root $root -TestBin $tests -DotNet (Get-Command dotnet).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the ARM64 Operations window under native load
        if: inputs.operations
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'filecat-native-storage-operations'
          $project = 'tests/FileCat.ArchiveQualificationHost'
          dotnet restore $project --locked-mode -p:RuntimeIdentifier=win-arm64 -p:SelfContained=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish $project -c Release -r win-arm64 --self-contained false --no-restore -o (Join-Path $root 'app')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build-server shutdown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . ./eng/validation/Enter-MediumIntegrityTestProcess.ps1
          [ordered]@{
            commit = $env:GITHUB_SHA
            runnerArchitecture = $env:RUNNER_ARCH
            integrity = [FileCatCiTokenIntegrity]::IntegrityRid()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'runner-native-operations.json')
          # Windows PowerShell provides the Windows Desktop UI Automation client used by the driver.
          $desktopPowerShell = Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $desktopPowerShell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/FileCat.NativeAcceptance/win-ax-ntfs-storage-scale.ps1 -TestRoot $root -HostedArm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = Get-Content -LiteralPath (Join-Path $root 'operations-scale.json') -Raw | ConvertFrom-Json
          if (!$receipt.Passed -or $receipt.FileCount -ne 10000 -or !$receipt.PrefixSha256 -or $receipt.JournalBytes -le 0) {
            throw 'The native ARM64 Operations driver must complete the full workload and retain its durable journal.'
          }
