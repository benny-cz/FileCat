name: Recovery fixtures

# Builds the disk images the recovery tests read (P10) with real file-system drivers on a disposable runner. Download
# the artifact and commit its files under tests/FileCat.Recovery.Tests/TestData/ when the scenario changes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: Build disk images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Make the images
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dosfstools exfatprogs ntfs-3g attr
          # The exfat kernel driver ships in the extra modules; exfat-fuse is the fallback.
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || sudo apt-get install -y -qq exfat-fuse
          sudo modprobe exfat || true
          sudo bash eng/make-recovery-fixtures.sh fixtures
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovery-fixtures
          path: fixtures/*.img.gz

  benchmark:
    name: Recovery benchmark (large images, P10)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Record exact build toolchain
        shell: pwsh
        run: ./eng/Write-BuildProvenance.ps1 -OutputPath "${{ runner.temp }}/filecat-build-provenance/build.json" -RequireCleanCheckout
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-provenance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/filecat-build-provenance/build.json
          if-no-files-found: error
      - name: Make the large images
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dosfstools ntfs-3g
          sudo bash eng/make-recovery-bench.sh "$RUNNER_TEMP/bench"
          sudo chmod -R a+r "$RUNNER_TEMP/bench"
      - name: Scan and preview them
        run: |
          dotnet build tests/FileCat.Core.Tests -c Release
          FILECAT_RECOVERY_BENCH="$RUNNER_TEMP/bench" dotnet test tests/FileCat.Core.Tests -c Release --no-build             --filter "FullyQualifiedName~RecoveryBenchmark" --logger "console;verbosity=detailed"
