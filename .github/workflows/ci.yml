name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual runs build the release packages without tagging (P9).
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  producer-policy:
    name: Producer reference policy (stable blocked)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Producer reference controls
        shell: pwsh
        run: ./eng/validation/validate-producer-reference.ps1 -EvidenceDirectory "${{ runner.temp }}/filecat-producer-reference-controls"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: producer-reference-controls
          path: ${{ runner.temp }}/filecat-producer-reference-controls/producer-reference-controls.json
          if-no-files-found: error
      - name: Refuse stable tag production
        shell: pwsh
        run: ./eng/Assert-ProducerReference.ps1 -Reference $env:GITHUB_REF -EventName $env:GITHUB_EVENT_NAME

  windows:
    name: Windows (build, all tests)
    needs: producer-policy
    runs-on: windows-2025-vs2026
    # A hung test stops the run in minutes, not hours; --blame-hang names it and dumps the processes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Record exact build toolchain
        shell: pwsh
        run: ./eng/Write-BuildProvenance.ps1 -OutputPath "${{ runner.temp }}/filecat-build-provenance/build.json" -RequireCleanCheckout
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-provenance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/filecat-build-provenance/build.json
          if-no-files-found: error
      - name: Release asset allowlist controls
        shell: pwsh
        run: ./eng/validation/validate-release-assets.ps1 -EvidenceDirectory "${{ runner.temp }}/filecat-release-assets-controls"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-controls-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/filecat-release-assets-controls/release-assets-controls.json
          if-no-files-found: error
      - run: dotnet build FileCat.slnx -c Release
      # FTP and FTPS tests run against pyftpdlib (MIT); they skip where it is missing.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyftpdlib pyopenssl
      - run: dotnet test FileCat.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --blame-hang-timeout 4m --blame-hang-dump-type mini
      - name: Windows instance profile aliases and state roots
        shell: pwsh
        run: |
          dotnet build tools/FileCat.InstanceSmoke -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python eng/validation/validate-windows-instance-processes.py --smoke-dll tools/FileCat.InstanceSmoke/bin/Release/net10.0/FileCat.InstanceSmoke.dll --evidence-dir "$env:RUNNER_TEMP/filecat-windows-instances"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-instance-results
          path: |
            ${{ runner.temp }}/filecat-windows-instances/results.json
            ${{ runner.temp }}/filecat-windows-instances/**/server.log
            ${{ runner.temp }}/filecat-windows-instances/**/forward-*.log
            ${{ runner.temp }}/filecat-windows-instances/**/probe.log
            ${{ runner.temp }}/filecat-windows-instances/**/ready.json
            ${{ runner.temp }}/filecat-windows-instances/**/received.json
      # D-56: an item's raw FAT32 directory entry (Windows' own case bits included), read from a virtual disk made here.
      - shell: pwsh
        run: |
          $letter = [char[]](75..90) | Where-Object { -not (Test-Path "$($_):\") } | Select-Object -Last 1
          $vhd = Join-Path $env:RUNNER_TEMP "fc-fat.vhdx"
          $script = Join-Path $env:RUNNER_TEMP "fc-fat.txt"
          "create vdisk file=`"$vhd`" maximum=64 type=expandable", "select vdisk file=`"$vhd`"", "attach vdisk", "convert mbr",
            "create partition primary", "format fs=fat32 quick label=FCFAT", "assign letter=$letter" | Set-Content $script
          diskpart /s $script
          $env:FILECAT_TEST_FAT_DRIVE = "$($letter):\"
          dotnet test tests/FileCat.Platform.Windows.Tests -c Release --no-build --filter "FullyQualifiedName~FatDriveRecordTests"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-windows
          path: |
            **/TestResults/*.trx
            **/TestResults/**/Sequence_*.xml
            **/TestResults/**/*.dmp
            src/FileCat.PrivilegedHost/obj/**/bootstrap-build.json
            src/FileCat.PrivilegedHost/obj/**/native-bootstrap*/compiler-*.log
            src/FileCat.PrivilegedHost/obj/**/native-bootstrap*/source-dependencies.json
            src/FileCat.PrivilegedHost/obj/**/native-bootstrap*/NativeBootstrap.map
            src/FileCat.PrivilegedHost/bin/Release/net10.0/FileCat.PrivilegedHost.exe

  # D-48: FileCat for Windows on ARM64, built and tested natively; its package starts and draws with the ARM64 Skia.
  windows-arm64:
    name: Windows ARM64 (build, tests, package start)
    needs: producer-policy
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Record exact build toolchain
        shell: pwsh
        run: ./eng/Write-BuildProvenance.ps1 -OutputPath "${{ runner.temp }}/filecat-build-provenance/build.json" -RequireCleanCheckout
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-provenance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/filecat-build-provenance/build.json
          if-no-files-found: error
      - run: dotnet build FileCat.slnx -c Release
      - run: dotnet test tests/FileCat.Core.Tests -c Release --no-build --logger "trx;LogFileName=core-results.trx"
      - name: Release asset allowlist controls
        shell: pwsh
        run: ./eng/validation/validate-release-assets.ps1 -EvidenceDirectory "${{ runner.temp }}/filecat-release-assets-controls"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-controls-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/filecat-release-assets-controls/release-assets-controls.json
          if-no-files-found: error
      - run: dotnet test tests/FileCat.Platform.Windows.Tests -c Release --no-build --logger "trx;LogFileName=platform-results.trx"
      # The remote clients ship for ARM64 too (release records E-A02: no lane ran them there).
      - run: dotnet test tests/FileCat.Remote.Tests -c Release --no-build --logger "trx;LogFileName=remote-results.trx" --blame-hang-timeout 4m --blame-hang-dump-type mini
      - run: dotnet test tests/FileCat.App.Tests -c Release --no-build --logger "trx;LogFileName=app-results.trx" --blame-hang-timeout 4m --blame-hang-dump-type mini
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-windows-arm64
          path: |
            **/TestResults/*.trx
            src/FileCat.PrivilegedHost/obj/**/bootstrap-build.json
            src/FileCat.PrivilegedHost/obj/**/native-bootstrap*/compiler-*.log
            src/FileCat.PrivilegedHost/obj/**/native-bootstrap*/source-dependencies.json
            src/FileCat.PrivilegedHost/obj/**/native-bootstrap*/NativeBootstrap.map
            src/FileCat.PrivilegedHost/bin/Release/net10.0/FileCat.PrivilegedHost.exe
      - name: The ARM64 package starts and draws its window
        shell: pwsh
        run: |
          ./eng/publish.ps1 -Version 0.0.0-arm64check -Runtime win-arm64
          $p = Start-Process artifacts/publish/win-arm64/FileCat.exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput version.txt
          Get-Content version.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path version.txt -Pattern '^FileCat 0\.0\.0-arm64check')) { throw 'The ARM64 package did not start.' }
          dotnet run --project eng/Screenshots -c Release -- artifacts/screenshots . --themes Classic --size 1280x720 --wait 3
          if (-not (Test-Path artifacts/screenshots/Classic.png)) { throw 'The ARM64 build drew nothing.' }
      - name: The ARM64 installer compiles
        shell: pwsh
        run: |
          $compiler = ./eng/Acquire-InnoSetup.ps1 -ToolRoot (Join-Path $env:RUNNER_TEMP ('FileCat-Inno-' + [guid]::NewGuid().ToString('N'))) -ReceiptDirectory (Join-Path $PWD 'artifacts/toolchains/inno-setup')
          ./eng/Compile-WindowsInstaller.ps1 -Version 0.0.0 -Architecture arm64 -CompilerRoot $compiler.ToolRoot -ReceiptDirectory $compiler.ReceiptDirectory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: inno-setup-provenance-windows-arm64
          path: artifacts/toolchains/inno-setup/**
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-arm64-screenshot
          path: artifacts/screenshots/*.png

  portable:
    needs: producer-policy
    name: ${{ matrix.os }} (build, portable tests)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Record exact build toolchain
        shell: pwsh
        run: ./eng/Write-BuildProvenance.ps1 -OutputPath "${{ runner.temp }}/filecat-build-provenance/build.json" -RequireCleanCheckout
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-provenance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/filecat-build-provenance/build.json
          if-no-files-found: error
      - run: dotnet build FileCat.slnx -c Release
      - run: dotnet test tests/FileCat.Core.Tests -c Release --no-build --logger "trx;LogFileName=core-results.trx"
      - name: Release asset allowlist controls
        shell: pwsh
        run: ./eng/validation/validate-release-assets.ps1 -EvidenceDirectory "${{ runner.temp }}/filecat-release-assets-controls"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-controls-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/filecat-release-assets-controls/release-assets-controls.json
          if-no-files-found: error
      # D-47: a drive read the way FileCat reads one, from the FAT16 fixture attached as a loop device (Linux) or a raw
      # disk image (macOS) that this user may read.
      - if: runner.os == 'Linux'
        run: |
          gunzip -c tests/FileCat.Core.Tests/TestData/Recovery/fat16.img.gz > "$RUNNER_TEMP/fat16.img"
          DEV=$(sudo losetup -f --show "$RUNNER_TEMP/fat16.img")
          sudo chown "$USER" "$DEV"
          FILECAT_TEST_BLOCK_DEVICE="$DEV" dotnet test tests/FileCat.Core.Tests -c Release --no-build --filter "FullyQualifiedName~UnixDeviceTests"
          sudo losetup -d "$DEV"
      - if: runner.os == 'macOS'
        run: |
          gunzip -c tests/FileCat.Core.Tests/TestData/Recovery/fat16.img.gz > "$RUNNER_TEMP/fat16.img"
          DISK=$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "$RUNNER_TEMP/fat16.img" | awk 'NR==1 {print $1}')
          RAW="${DISK/disk/rdisk}"
          sudo chown "$USER" "$RAW"
          FILECAT_TEST_BLOCK_DEVICE="$RAW" dotnet test tests/FileCat.Core.Tests -c Release --no-build --filter "FullyQualifiedName~UnixDeviceTests"
          hdiutil detach "$DISK"
      # Saved passwords against a real Secret Service: GNOME Keyring in a private D-Bus session (macOS uses its keychain).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gnome-keyring dbus libsecret-1-0
          dbus-run-session -- bash -c 'gnome-keyring-daemon --components=secrets --daemonize --unlock <<< "ci-keyring" > /dev/null &&
            FILECAT_REQUIRE_SECRET_STORE=1 dotnet test tests/FileCat.Core.Tests -c Release --no-build --filter "FullyQualifiedName~SecretStoreTests"'
      # D-54: a real Samba server with a guest share, listed by smbclient or gvfs and mounted by gvfs in a D-Bus session.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends samba smbclient gvfs-backends gvfs-fuse dbus
          sudo mkdir -p /srv/filecat-public && echo hello | sudo tee /srv/filecat-public/hello.txt > /dev/null && sudo chmod -R a+rX /srv/filecat-public
          printf '[filecat-public]\n  path = /srv/filecat-public\n  guest ok = yes\n  read only = yes\n' | sudo tee -a /etc/samba/smb.conf > /dev/null
          sudo systemctl restart smbd
          export XDG_RUNTIME_DIR="$(mktemp -d)" && chmod 700 "$XDG_RUNTIME_DIR"
          FILECAT_TEST_SAMBA=1 FILECAT_TEST_GVFS=1 dbus-run-session -- dotnet test tests/FileCat.Core.Tests -c Release --no-build --filter "FullyQualifiedName~UnixNetworkTests"
      # D-56: an item's raw FAT32 and exFAT directory entries, read as root from loop-mounted volumes (root's own home and
      # results folder, so later steps keep theirs).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq --no-install-recommends dosfstools exfatprogs
          truncate -s 64M "$RUNNER_TEMP/fc-vfat.img" && mkfs.vfat -F 32 -n FCFAT "$RUNNER_TEMP/fc-vfat.img" > /dev/null
          truncate -s 64M "$RUNNER_TEMP/fc-exfat.img" && mkfs.exfat -n FCEXFAT "$RUNNER_TEMP/fc-exfat.img" > /dev/null
          sudo mkdir -p /mnt/fc-vfat /mnt/fc-exfat
          sudo mount -o loop "$RUNNER_TEMP/fc-vfat.img" /mnt/fc-vfat
          # The runner's kernel may lack exFAT: then exfat-fuse mounts it (type "fuseblk", which the reader recognizes by its boot sector).
          if ! sudo mount -o loop "$RUNNER_TEMP/fc-exfat.img" /mnt/fc-exfat 2>/dev/null; then
            sudo apt-get install -y -qq --no-install-recommends exfat-fuse
            sudo mount.exfat-fuse "$(sudo losetup -f --show "$RUNNER_TEMP/fc-exfat.img")" /mnt/fc-exfat
          fi
          grep -E ' /mnt/fc-(v|ex)fat ' /proc/self/mountinfo
          sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" HOME=/root DOTNET_CLI_HOME=/root FILECAT_TEST_FAT_MOUNTS=/mnt/fc-vfat,/mnt/fc-exfat \
            dotnet test tests/FileCat.Core.Tests -c Release --no-build --results-directory "$RUNNER_TEMP/root-results" --filter "FullyQualifiedName~UnixFatRecordTests"
          sudo umount /mnt/fc-vfat /mnt/fc-exfat
      # Real-server SFTP tests start a user-mode sshd (macOS ships one).
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends openssh-server
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyftpdlib pyopenssl
      # A hang (a test server that never answers) fails in minutes with a dump of where, not at the job's time limit.
      - run: dotnet test tests/FileCat.Remote.Tests -c Release --no-build --logger "trx;LogFileName=remote-results.trx" --blame-hang-timeout 4m --blame-hang-dump-type mini
      # P9: the UI runs headless on Linux and macOS too.
      - run: dotnet test tests/FileCat.App.Tests -c Release --no-build --logger "trx;LogFileName=app-results.trx" --blame-hang-timeout 4m --blame-hang-dump-type mini
      # D-51: web pages drawn by WebKitGTK, on a virtual X display; a missing engine fails here instead of skipping.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-0 xvfb
          FILECAT_REQUIRE_WEBKIT=1 xvfb-run -a dotnet test tests/FileCat.App.Tests -c Release --no-build --filter "FullyQualifiedName~LinuxPageEngineTests" --blame-hang-timeout 3m --blame-hang-dump-type mini
      # D-51 on macOS: WKWebView on the runner's display, from a program whose main thread runs the run loop.
      - if: runner.os == 'macOS'
        run: dotnet run --project tests/FileCat.PageEngineSmoke -c Release
      - name: Linux tar desktop launcher paths
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq --no-install-recommends python3-gi desktop-file-utils
          evidence="filecat-desktop-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          result=0
          /usr/bin/python3 eng/validation/validate-linux-desktop-entry.py \
            --helper "$PWD/eng/install-linux-desktop-entry.sh" --evidence-dir "$RUNNER_TEMP/$evidence" || result=$?
          tar -czf "$RUNNER_TEMP/filecat-desktop-results.tar.gz" -C "$RUNNER_TEMP" "$evidence"
          exit "$result"
      - name: Unix instance IPC with unusual temporary paths
        run: |
          evidence="filecat-instance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          result=0
          python3 eng/validation/validate-unix-instance.py \
            --test-dll "$PWD/tests/FileCat.App.Tests/bin/Release/net10.0/FileCat.App.Tests.dll" \
            --evidence-dir "$RUNNER_TEMP/$evidence" || result=$?
          tar -czf "$RUNNER_TEMP/filecat-instance-results.tar.gz" -C "$RUNNER_TEMP" "$evidence"
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: unix-instance-results-${{ matrix.os }}
          path: ${{ runner.temp }}/filecat-instance-results.tar.gz
      - name: Unix instances across sessions and temporary folders
        run: |
          dotnet build tools/FileCat.InstanceSmoke -c Release
          evidence="filecat-instance-processes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          result=0
          python3 eng/validation/validate-unix-instance-processes.py \
            --smoke-dll "$PWD/tools/FileCat.InstanceSmoke/bin/Release/net10.0/FileCat.InstanceSmoke.dll" \
            --evidence-dir "$RUNNER_TEMP/$evidence" || result=$?
          tar -czf "$RUNNER_TEMP/filecat-instance-process-results.tar.gz" -C "$RUNNER_TEMP" "$evidence"
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: unix-instance-process-results-${{ matrix.os }}
          path: ${{ runner.temp }}/filecat-instance-process-results.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && runner.os == 'Linux'
        with:
          name: linux-desktop-launcher-results
          path: ${{ runner.temp }}/filecat-desktop-results.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: app-test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"

  package:
    name: Package (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [producer-policy, windows, windows-arm64, portable]
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Record exact build toolchain
        shell: pwsh
        run: ./eng/Write-BuildProvenance.ps1 -OutputPath "${{ runner.temp }}/filecat-build-provenance/build.json" -RequireCleanCheckout
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-provenance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/filecat-build-provenance/build.json
          if-no-files-found: error
      - name: Publish portable, framework-dependent, and installer payloads (x64 and ARM64, D-48)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          ./eng/publish.ps1 -Version $v
          ./eng/publish.ps1 -Version $v -Runtime win-arm64
      - name: Build installers
        shell: pwsh
        run: |
          $compiler = ./eng/Acquire-InnoSetup.ps1 -ToolRoot (Join-Path $env:RUNNER_TEMP ('FileCat-Inno-' + [guid]::NewGuid().ToString('N'))) -ReceiptDirectory (Join-Path $PWD 'artifacts/toolchains/inno-setup')
          $v = "${{ github.ref_name }}".TrimStart('v').Split('-')[0]
          ./eng/Compile-WindowsInstaller.ps1 -Version $v -CompilerRoot $compiler.ToolRoot -ReceiptDirectory $compiler.ReceiptDirectory
          ./eng/Compile-WindowsInstaller.ps1 -Version $v -Architecture arm64 -CompilerRoot $compiler.ToolRoot -ReceiptDirectory $compiler.ReceiptDirectory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: inno-setup-provenance-windows-package
          path: artifacts/toolchains/inno-setup/**
      # Code signing (ADR-15): SignPath Foundation signs the artifacts built here from tagged source.
      # Configure the SignPath project and its GitHub integration, then add the signing step here.
      # Until then releases are published as clearly labeled, unsigned previews.
      - name: Select exact Windows release assets
        id: assets
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: ./eng/Select-ReleaseAssets.ps1 -Platform windows -Version $env:PACKAGE_VERSION.Substring(1) -SourceCommit $env:GITHUB_SHA -GitHubOutputPath $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: filecat-release
          path: ${{ steps.assets.outputs.files }}
          if-no-files-found: error
      - name: Draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3, pinned: this step can write releases
        with:
          draft: true
          prerelease: true
          name: FileCat ${{ github.ref_name }} (unsigned preview)
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true

  package-linux:
    name: Package Linux (tags and manual runs)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [producer-policy, windows, windows-arm64, portable]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Record exact build toolchain
        shell: pwsh
        run: ./eng/Write-BuildProvenance.ps1 -OutputPath "${{ runner.temp }}/filecat-build-provenance/build.json" -RequireCleanCheckout
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-provenance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/filecat-build-provenance/build.json
          if-no-files-found: error
      - name: Build the tarball, .deb, and AppImage
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || v="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          ./eng/package-linux.sh "$v" linux-x64
      - name: Install and start each package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./artifacts/filecat_*.deb
          filecat --version
          # The icon at every size it is drawn for, so a desktop need not shrink the large artwork.
          for s in 16 24 32 48 64 128 256; do test -s "/usr/share/icons/hicolor/${s}x${s}/apps/filecat.png"; done
          APPIMAGE_EXTRACT_AND_RUN=1 ./artifacts/FileCat-*-x86_64.AppImage --version
          mkdir unpacked && tar -xzf artifacts/FileCat-*-linux-x64.tar.gz -C unpacked
          unpacked/FileCat-*/FileCat --version
      - name: Select exact Linux release assets
        id: assets
        shell: pwsh
        env:
          PACKAGE_REF: ${{ github.ref }}
          PACKAGE_REF_NAME: ${{ github.ref_name }}
        run: |
          $v = if ($env:PACKAGE_REF.StartsWith('refs/tags/v')) { $env:PACKAGE_REF_NAME.Substring(1) } else { "0.1.0-dev.$env:GITHUB_RUN_NUMBER" }
          ./eng/Select-ReleaseAssets.ps1 -Platform linux -Version $v -SourceCommit $env:GITHUB_SHA -GitHubOutputPath $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: filecat-linux
          path: ${{ steps.assets.outputs.files }}
          if-no-files-found: error
      - name: Add to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3, pinned: this step can write releases
        with:
          draft: true
          prerelease: true
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true

  package-macos:
    name: Package macOS (tags and manual runs)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [producer-policy, windows, windows-arm64, portable]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Record exact build toolchain
        shell: pwsh
        run: ./eng/Write-BuildProvenance.ps1 -OutputPath "${{ runner.temp }}/filecat-build-provenance/build.json" -RequireCleanCheckout
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-provenance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/filecat-build-provenance/build.json
          if-no-files-found: error
      - name: Build the app (ad-hoc signed, not notarized)
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || v="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          ./eng/package-macos.sh "$v"
      - name: Start the packaged app
        run: |
          mkdir unpacked && ditto -x -k artifacts/FileCat-*-osx-arm64.zip unpacked
          codesign --verify --deep --strict unpacked/FileCat.app
          unpacked/FileCat.app/Contents/MacOS/FileCat --version
          # The icon at every size macOS asks for, the small ones from the frames drawn for them.
          iconutil -c iconset unpacked/FileCat.app/Contents/Resources/FileCat.icns -o icon-check.iconset
          test "$(ls icon-check.iconset | wc -l)" -eq 7
      - name: Select exact macOS release assets
        id: assets
        shell: pwsh
        env:
          PACKAGE_REF: ${{ github.ref }}
          PACKAGE_REF_NAME: ${{ github.ref_name }}
        run: |
          $v = if ($env:PACKAGE_REF.StartsWith('refs/tags/v')) { $env:PACKAGE_REF_NAME.Substring(1) } else { "0.1.0-dev.$env:GITHUB_RUN_NUMBER" }
          ./eng/Select-ReleaseAssets.ps1 -Platform macos -Version $v -SourceCommit $env:GITHUB_SHA -GitHubOutputPath $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: filecat-macos
          path: ${{ steps.assets.outputs.files }}
          if-no-files-found: error
      - name: Add to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3, pinned: this step can write releases
        with:
          draft: true
          prerelease: true
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true
