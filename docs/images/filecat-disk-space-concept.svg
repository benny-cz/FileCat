<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">FileCat Disk space: experience concept</title><desc id="desc">Design concept showing equal Treemap and Sunburst choices, consistent storage totals, an evidence inspector, and a danger-styled recycling review with an initially focused Keep files default. Recycling is distinguished from free-space gain. Illustrative data, not a running application.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111927"/><stop offset="1" stop-color="#192b37"/></linearGradient></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.muted{fill:#bdc8d9}.text{fill:#f2f6fc}.small{font-size:15px}.body{font-size:17px}.label{font-size:13px;font-weight:600;letter-spacing:1.2px}.number{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}</style><rect width="1600" height="1120" fill="url(#bg)"/>
